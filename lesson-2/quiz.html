<style>*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#EEF4F2;--ink:#17312B;--mut:#5E756F;--acc:#127A63;--card:#fff;--line:#D3E2DD;--ok:#127A63;--no:#C0392B}
body{background:var(--bg);color:var(--ink);font-family:Rubik,Arial,sans-serif;padding-inline:16px;line-height:1.5}
.wrap{max-width:720px;margin:auto;padding-block:28px 60px;display:flex;flex-direction:column;gap:14px}
.head{background:var(--card);border-top:10px solid var(--acc);border-radius:12px;padding:22px}
h1{font-size:clamp(24px,4vw,32px)}.head p{color:var(--mut)}
.who{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.who label{flex:1;min-width:160px;font-size:14px;font-weight:500;display:flex;flex-direction:column;gap:4px}
input[type=text]{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px}
fieldset{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
legend{font-weight:700;font-size:17px;padding:0;float:right;width:100%;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:8px;cursor:pointer}
.opt:hover{background:#F3F8F6}.opt input{margin-top:5px;accent-color:var(--acc);width:18px;height:18px;flex:none}
.opt.ok{background:#E2F3EC;color:var(--ok);font-weight:500}.opt.no{background:#FBE7E5;color:var(--no);text-decoration:line-through}
.ex{display:none;margin-top:8px;font-size:14px;color:var(--mut)}.done .ex{display:block}
.send{font:inherit;font-weight:700;background:var(--acc);color:#fff;border:0;border-radius:8px;padding:12px 24px;cursor:pointer;align-self:flex-start}
.res{display:none;background:var(--card);border-radius:12px;padding:20px;border:2px solid var(--acc)}.res.on{display:block}
.res .n{font-size:48px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.miss{color:var(--no);font-size:14px}

<body><nav class="homebar" aria-label="ניווט"><a href="../index.html">🏠 דף הבית</a><a href="index.html">→ לשיעור</a></nav><div class="wrap"><div class="head"><h1>המחזור הגדול והמחזור הקטן</h1><p>17 שאלות רב־ברירה. כתבו שם וכיתה, ענו על כל השאלות ולחצו על "הגשה". בסוף תקבלו ציון ובדיקה של כל תשובה, ותוכלו לשמור את הכול כקובץ PDF.</p>

<div class="res" id="res"></div></div><script>const Q=[{"q": "מהו התפקיד העיקרי של המחזור הקטן?", "o": ["הובלת חמצן מתאי הגוף אל הכבד", "העברת דם אל הריאות, שבהן מתרחש חילוף גזים", "הזרמת דם עשיר בחמצן לכל תאי הגוף", "העברת מזון מן המעי אל הלב"], "a": 1, "e": "המחזור הקטן מוביל דם מהלב לריאות ובחזרה. בריאות הדם קולט חמצן ופולט פחמן דו־חמצני."}, {"q": "איזה כלי דם מחזיר דם עשיר בחמצן אל הלב?", "o": ["עורקי הריאה", "אבי העורקים", "ורידי הגוף הגדולים", "ורידי הריאה"], "a": 3, "e": "ורידי הריאה מחזירים דם עשיר בחמצן מהריאות אל העלייה השמאלית."}, {"q": "מה תפקידם של השסתומים בלב?", "o": ["מבצעים חילוף גזים", "מזרימים דם עני בחמצן אל הריאות", "מונעים זרימת דם לאחור", "מזרימים דם עשיר בחמצן אל הגוף"], "a": 2, "e": "השסתומים נפתחים בכיוון אחד בלבד, ולכן הדם לא חוזר לאחור."}, {"q": "מה תפקידם של עורקי הריאה?", "o": ["מזרימים דם עני בחמצן אל הריאות", "מזרימים דם עשיר בחמצן אל הגוף", "מחזירים דם עשיר בחמצן אל הלב", "מבצעים חילוף גזים"], "a": 0, "e": "עורקי הריאה יוצאים מהחדר הימני ומובילים דם עני בחמצן אל הריאות."}, {"q": "איזה מבנה מזרים דם עשיר בחמצן אל הגוף?", "o": ["החדר הימני", "העלייה השמאלית", "החדר השמאלי", "נימי הריאות"], "a": 2, "e": "החדר השמאלי מתכווץ ומזרים דם עשיר בחמצן דרך אבי העורקים לכל הגוף."}, {"q": "המחזור הגדול מתחיל ב:", "o": ["עלייה ימנית", "חדר ימני", "עלייה שמאלית", "חדר שמאלי"], "a": 3, "e": "המחזור הגדול מתחיל בחדר השמאלי ומסתיים בעלייה הימנית."}, {"q": "בתהליך הנשימה התאית מנוצל _____, ומשתחררת אנרגיה.", "o": ["חמצן", "פחמן דו־חמצני", "חנקן", "מים"], "a": 0, "e": "בנשימה התאית מנוצל חמצן ונוצר פחמן דו־חמצני."}, {"q": "כיצד מבנה השסתומים קשור ליעילות פעולת מערכת הדם?", "o": ["הם מגדילים את נפח הדם", "הם מאפשרים זרימה בכיוון אחד בלבד ומונעים חזרת דם לאחור", "הם מסננים פסולת מן הדם", "הם מחממים את הדם"], "a": 1, "e": "זרימה בכיוון אחד שומרת על לחץ דם תקין ועל אספקת חמצן רציפה לתאים."}, {"q": "מה צפוי לקרות אם זרימת הדם לריאות תיפגע באופן משמעותי?", "o": ["עלייה בכמות החמצן בדם", "הפסקת פעילות מערכת העיכול בלבד", "הגדלת מספר השסתומים בלב", "ירידה ביכולת תאי הגוף להפיק אנרגיה"], "a": 3, "e": "בלי מעבר בריאות הדם לא יקלוט חמצן, ולכן הפקת האנרגיה בנשימה התאית בתאי הגוף תפחת."}, {"q": "איזה מהפריטים הבאים שייך למחזור הקטן?", "o": ["אבי העורקים", "אספקת חמצן לתאי הגוף", "חילוף גזים בריאות", "חזרת דם מן הגוף ללב"], "a": 2, "e": "חילוף הגזים בריאות הוא חלק מהמחזור הקטן. שאר הפריטים שייכים למחזור הגדול."}, {"q": "מה ההבדל העיקרי בין המחזור הגדול למחזור הקטן?", "o": ["הגדול מוביל דם מהלב לכל הגוף וחזרה, והקטן מוביל דם מהלב לריאות וחזרה", "הגדול מתחיל בחדר הימני והקטן בחדר השמאלי", "בקטן זורם רק דם עשיר בחמצן, ובגדול רק דם עני בחמצן", "בגדול אין נימים ובקטן יש נימים"], "a": 0, "e": "הגדול מספק חמצן לתאי הגוף, והקטן מאפשר חילוף גזים בריאות."}, {"q": "דופן החדר השמאלי עבה יותר מדופן החדר הימני. מה הקשר בין מבנה זה לתפקוד החדר השמאלי?", "o": ["דופן עבה מאטה את קליטת הדם מן הריאות", "דופן עבה מאפשרת יצירת לחץ גבוה, המזרים דם לכל הגוף", "דופן עבה מחליפה את פעולת השסתומים", "דופן עבה מקטינה את מספר כלי הדם בלב"], "a": 1, "e": "שריר עבה מתכווץ בעוצמה רבה ויוצר לחץ גבוה, וכך הדם זורם לכל חלקי הגוף."}, {"q": "תא דם אדום עבר מיד ימין לרגל ימין. במסלולו הוא חייב לעבור דרך:", "o": ["הראש", "המעי הדק", "הריאות", "הכבד"], "a": 2, "e": "מהיד הדם חוזר ללב הימני, עובר בריאות, חוזר ללב השמאלי ורק אז זורם לרגל."}, {"q": "אישה בלעה כדור אקמול נגד כאב ראש. כמה פעמים תעבור התרופה דרך הלב עד שתגיע למוח?", "o": ["פעם אחת", "פעמיים", "שלוש פעמים", "ארבע פעמים"], "a": 1, "e": "לב ימני ← ריאות ← לב שמאלי ← מוח: שני מעברים בלב."}, {"q": "באילו כלי דם ריכוז החמצן הוא הגבוה ביותר?", "o": ["ורידי המחזור הגדול", "עורקי המחזור הקטן", "נימי המחזור הגדול", "ורידי המחזור הקטן"], "a": 3, "e": "ורידי המחזור הקטן (ורידי הריאה) מובילים דם שזה עתה קלט חמצן בריאות."}, {"q": "ב'המסע של טיפה' הלב מוצג כשתי משאבות זו לצד זו, וב'מעבדת המסלולים' הלב מצויר כאיבר אחד עם כלי הדם והאיברים. מה נכון לגבי שני הייצוגים?", "o": ["בסכימה של שתי המשאבות הדם עובר ישירות מהמשאבה הימנית לשמאלית, ובאיור אין מעבר כזה", "שני הייצוגים מתארים אותו מסלול: הצד הימני של הלב מזרים דם לריאות והצד השמאלי מזרים דם לגוף. הסכימה מפשטת, והאיור מוסיף מיקום ומבנה", "בסכימה יש ארבעה חללים, ובאיור יש שני חללים בלבד", "באיור הדם זורם במעגל אחד, ובסכימה הדם זורם בשני מעגלים"], "a": 1, "e": "שני הייצוגים מציגים ארבעה חללים ושני מעגלים. הסכימה מפרידה את שני צדי הלב לשתי משאבות, והאיור מציג את הלב כאיבר אחד עם מחיצה, כלי דם ורשתות נימים באיברים."}, {"q": "באיור של 'מעבדת המסלולים', הצד השמאלי של הלב מופיע בצד ימין של הדף. מה ההסבר לכך?", "o": ["זו טעות באיור", "האיור מציג את הלב כפי שהוא נראה באדם העומד מול הצופה", "הלב נמצא בצד ימין של בית החזה", "בצד ימין של הדף מופיע תמיד הדם העני בחמצן"], "a": 1, "e": "באיורים אנטומיים מציגים את הגוף כפי שהוא נראה מולנו, ולכן הצד השמאלי של הגוף מופיע בצד ימין של הדף. כך גם בסכימה של שתי המשאבות: 'משאבה שמאלית' מופיעה מימין."}];const L="אבגד";const f=document.getElementById('f');
f.innerHTML=Q.map((x,i)=>`<fieldset id="q${i}"><legend>${i+1}. ${x.q}</legend>${x.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}">${L[j]}. ${o}</label>`).join('')}<p class="ex">${x.e}</p></fieldset>`).join('');
document.getElementById('send').onclick=()=>{if(!document.getElementById('nm').value.trim()){document.getElementById('miss').textContent='כתבו את השם שלכם למעלה.';document.getElementById('nm').focus();return}const miss=Q.map((x,i)=>f.querySelector(`[name=q${i}]:checked`)?null:i+1).filter(Boolean);
 if(miss.length){document.getElementById('miss').textContent='לא עניתם על שאלות: '+miss.join(', ');return}
 document.getElementById('miss').textContent='';let s=0;
 Q.forEach((x,i)=>{const fs=document.getElementById('q'+i),v=+f.querySelector(`[name=q${i}]:checked`).value;fs.classList.add('done');
  fs.querySelectorAll('.opt').forEach((l,j)=>{if(j===x.a)l.classList.add('ok');else if(j===v)l.classList.add('no')});
  fs.querySelectorAll('input').forEach(n=>n.disabled=true);if(v===x.a)s++});
 const r=document.getElementById('res'),nm=document.getElementById('nm').value.trim(),cl=document.getElementById('cl').value.trim();
 r.innerHTML=`<div>${nm?nm.replace(/[<>&]/g,''):''} ${cl?'· '+cl.replace(/[<>&]/g,''):''}</div><div class="n">${Math.round(s/Q.length*100)}</div><div>${s} תשובות נכונות מתוך ${Q.length}</div>`;r.classList.add('on');r.insertAdjacentHTML('beforeend',`<button type="button" class="pdfbtn" onclick="window.print()">📄 שמירה כ־PDF</button><p class="pdfhint">בחלון שנפתח בחרו "שמירה כ־PDF" (Save as PDF), ושמרו או הגישו את הקובץ.</p>`);
