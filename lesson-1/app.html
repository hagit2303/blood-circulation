  opts:[['פחמן דו־חמצני עובר מהדם לאוויר, וחמצן עובר מהאוויר לדם',1,'נכון. זהו חילוף הגזים בריאות.'],['חמצן עובר מהדם לאוויר',0,'הדם הגיע עני בחמצן. מה עובר מהאוויר אל הדם?'],['רק פחמן דו־חמצני יוצא',0,'נכון בחלקו. ומה נכנס?']]},

 {st:3,t:'find',id:'la',prompt:'לאיזה חלל בלב נכנס הדם שחוזר מהריאות? לחצו עליו.',miss:'עקבו אחרי כלי הדם שחוזר מהריאות.',bad:'הדם קיבל חמצן בריאות.'},
 {st:3,t:'q',prompt:'ומכאן?',
  opts:[['לחדר השמאלי, ומשם שוב לגוף',1,'המעגל נסגר!'],['לחדר הימני',0,'המחיצה אטומה. המסתם מוביל כלפי מטה.'],['חזרה לריאות',0,'המסתמים מאפשרים זרימה בכיוון אחד בלבד.']]},
 {st:4,t:'label',prompt:'תנו שמות לכלי הדם הגדולים. בחרו שם ולחצו על כלי הדם.<br><small>עורק מוביל דם מהלב, וריד מחזיר דם אל הלב.</small>',

];
const NAME={ra:'עלייה ימנית',la:'עלייה שמאלית',rv:'חדר ימני',lv:'חדר שמאלי',ao:'אבי העורקים',pa:'עורק הריאה',vc:'וריד נבוב',pv:'וריד הריאה'};
const NQ={ra:['נכון! איך נקרא החלל הזה, שאליו חוזר הדם מהגוף?',[['עלייה ימנית',1],['עלייה שמאלית',0,'העלייה השמאלית נמצאת מעל החדר השמאלי, ושום כלי דם מהגוף לא מגיע אליה.'],['חדר ימני',0,'זה חלל עליון שמקבל דם. איך קוראים לחללים כאלה?']]],
 rv:['ואיך נקרא החלל הזה?',[['חדר ימני',1],['חדר שמאלי',0,'החדר השמאלי כבר מסומן באיור.'],['עלייה ימנית',0,'זה חלל תחתון ושרירי שדוחף דם החוצה.']]],
 la:['איך נקרא החלל שאליו חוזר הדם מהריאות?',[['עלייה שמאלית',1],['עלייה ימנית',0,'לעלייה הימנית חוזר הדם מהגוף.'],['חדר שמאלי',0,'החדר השמאלי כבר מסומן. זה החלל שמעליו.']]]};
const BIG=['lv','v4','ao','body','gxB','vc','ra'],SMALL=['rv','v3','pa','lungs','gxL','pv','la'];
const ALL=[...CH,...VL,...VS,'body','lungs','gxB','gxL'];
let k=-1,brush=null,chip=null,labels={},colors={ra:'poor',rv:'poor',la:'rich',lv:'rich'},busy=false,naming=false;
const H=window.HOOK||{};
function fb(m,g){const f=$('fb');f.innerHTML=m||'';f.className=m?(g?'good':'bad'):''}
function show(ids){(ids||[]).forEach(id=>document.querySelectorAll('#'+id+',[data-of="'+id+'"]').forEach(e=>e.classList.remove('hid')))}
function shake(id){const e=$(id);if(!e)return;e.classList.remove('shake');void e.getBBox();e.classList.add('shake')}
let vb=[150,200,300,280];
function zoom(){const hs=$('hs'),to=!$('lungs').classList.contains('hid')?[0,0,600,690]:!$('ao').classList.contains('hid')?[30,195,540,495]:[150,200,300,280];
  const from=vb.slice(),t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/900),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    vb=from.map((v,i)=>v+(to[i]-v)*e);hs.setAttribute('viewBox',vb.join(' '));if(p<1)requestAnimationFrame(f)})(t0)}
function next(){k++;busy=false;const s=STEPS[k];document.querySelectorAll('.target').forEach(e=>e.classList.remove('target'));show(s.show);zoom();
  document.querySelectorAll('[data-st]').forEach(e=>{const n=+e.dataset.st;e.classList.toggle('cur',n===s.st);e.classList.toggle('past',n<s.st)});
  $('stName').textContent=STAGES[s.st];$('prompt').innerHTML=s.prompt||'';$('opts').innerHTML='';$('chips').innerHTML='';fb('');
  $('pal').style.display=s.t==='color'?'':'none';chip=null;
  if(s.t==='color'&&!s.find)$(s.id).classList.add('target');
  if(s.t==='label'){s.left=s.chips.slice();drawChips(s)}
  if(s.t==='q'){$('opts').innerHTML=s.opts.map((o,j)=>`<button type="button" data-j="${j}">${o[0]}</button>`).join('');
    [...$('opts').children].forEach(b=>b.onclick=()=>{if(busy)return;const o=s.opts[+b.dataset.j];
      if(o[1]){busy=true;b.classList.add('good');fb(o[2],true);setTimeout(next,1500)}else{b.classList.add('bad');fb(o[2])}})}
  if(s.t==='done')finish();
  H.step&&H.step(s,k,STEPS.length);
}
function drawChips(s){$('chips').innerHTML=s.left.map((c,j)=>`<button type="button" data-j="${j}">${c[1]}</button>`).join('');
  [...$('chips').children].forEach(b=>b.onclick=()=>{chip=s.left[+b.dataset.j];[...$('chips').children].forEach(x=>x.classList.toggle('on',x===b))})}
function match(c,id){return c===id||(c==='atr'&&(id==='ra'||id==='la'))||(c==='ven'&&id==='rv')||(c==='av'&&(id==='v1'||id==='v2'))||(c==='sl'&&(id==='v3'||id==='v4'))}
function hint(c,id){
  if(id==='sep')return 'זו המחיצה, לא חלל ולא מסתם.';
  const cc=CH.includes(c[0]),pc=CH.includes(id),cv=c[0]==='av'||c[0]==='sl',pv=VL.includes(id);
  if(cc&&pv)return 'זה מסתם, לא חלל.';
  if(cv&&pc)return 'זה חלל, לא מסתם.';
  if(cv)return c[0]==='av'?'מסתם בין עלייה לחדר נמצא בין החלל העליון לחלל התחתון.':'מסתם בין חדר לעורק נמצא ביציאה מהחדר אל כלי הדם.';
  if(cc){if(c[0][1]!==id[1])return 'עליות: קטנות, דופן דקה, מקבלות דם. חדרים: גדולים ושריריים, שואבים את הדם החוצה.';return 'בדקו לאיזו משאבה שייך החלל הזה.'}
  if(VS.includes(c[0]))return 'עורק מוביל דם מהלב, וריד מחזיר דם אל הלב. ומאיפה לאן הוא זורם?';
  return 'לא כאן. נסו שוב.';}
function label(s,id){
  if(!chip){fb('בחרו קודם שם מהרשימה.');return}
  if(labels[id]){fb('לחלק הזה כבר יש שם.');return}

  H.color&&H.color(id,brush);if(NQ[id])setTimeout(()=>askName(id),700);else setTimeout(next,750)}
function askName(id){const [p,o]=NQ[id];naming=true;busy=false;$('pal').style.display='none';$('prompt').innerHTML=p;fb('');
  $('opts').innerHTML=o.map((x,j)=>`<button type="button" data-j="${j}">${x[0]}</button>`).join('');
  [...$('opts').children].forEach(b=>b.onclick=()=>{if(busy)return;const x=o[+b.dataset.j];
    if(x[1]){busy=true;naming=false;b.classList.add('good');labels[id]=NAME[id];renderLabels();fb('נכון!',true);setTimeout(next,1200)}else{b.classList.add('bad');fb(x[2])}})}
document.querySelectorAll('#hs .part').forEach(p=>p.addEventListener('click',()=>{if(busy)return;if(naming){fb('ענו קודם על השאלה.');return}const s=STEPS[k];
  if(s.t==='label')label(s,p.id);else if(s.t==='color')paint(s,p.id);else if(s.t==='find')find(s,p.id);else if(s.t==='q')fb('ענו קודם על השאלה.')}));
document.querySelectorAll('#pal [data-c]').forEach(b=>b.onclick=()=>{brush=b.dataset.c;document.querySelectorAll('#pal [data-c]').forEach(x=>x.classList.toggle('on',x===b));H.brush&&H.brush(brush)});
function hl(set){ALL.forEach(id=>{const e=$(id);if(e)e.classList.toggle('dim',!!set&&!set.includes(id))});
  document.querySelectorAll('.case').forEach(e=>e.classList.toggle('dim',!!set&&!set.includes('pa')));
  document.querySelectorAll('.flow').forEach(e=>e.classList.toggle('dim',!!set&&!set.includes(e.dataset.f)));
  $('lbl').classList.toggle('dim',!!set);}
function finish(){$('flows').classList.remove('hid');$('pal').style.display='none';const f=$('fin');if(f)f.hidden=false;
  document.querySelectorAll('[data-hl]').forEach(b=>b.onclick=()=>{const v=b.dataset.hl;hl(v==='big'?BIG:v==='small'?SMALL:null);
    document.querySelectorAll('[data-hl]').forEach(x=>x.classList.toggle('on',x===b))});
  H.done&&H.done()}
const r=$('restart');if(r)r.onclick=()=>location.reload();
renderLabels();next();
})();</script>
