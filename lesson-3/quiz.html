<style>*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#EEF4F2;--ink:#17312B;--mut:#5E756F;--acc:#127A63;--card:#fff;--line:#D3E2DD;--ok:#127A63;--no:#C0392B}
body{background:var(--bg);color:var(--ink);font-family:Rubik,Arial,sans-serif;padding-inline:16px;line-height:1.5}
.wrap{max-width:720px;margin:auto;padding-block:28px 60px;display:flex;flex-direction:column;gap:14px}
.head{background:var(--card);border-top:10px solid var(--acc);border-radius:12px;padding:22px}
h1{font-size:clamp(24px,4vw,32px)}.head p{color:var(--mut)}
.who{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.who label{flex:1;min-width:160px;font-size:14px;font-weight:500;display:flex;flex-direction:column;gap:4px}
input[type=text]{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px}
fieldset{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
legend{font-weight:700;font-size:17px;padding:0;float:right;width:100%;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:8px;cursor:pointer}
.opt:hover{background:#F3F8F6}.opt input{margin-top:5px;accent-color:var(--acc);width:18px;height:18px;flex:none}
.opt.ok{background:#E2F3EC;color:var(--ok);font-weight:500}.opt.no{background:#FBE7E5;color:var(--no);text-decoration:line-through}
.ex{display:none;margin-top:8px;font-size:14px;color:var(--mut)}.done .ex{display:block}
.send{font:inherit;font-weight:700;background:var(--acc);color:#fff;border:0;border-radius:8px;padding:12px 24px;cursor:pointer;align-self:flex-start}
.res{display:none;background:var(--card);border-radius:12px;padding:20px;border:2px solid var(--acc)}.res.on{display:block}
.res .n{font-size:48px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.miss{color:var(--no);font-size:14px}

<body><nav class="homebar" aria-label="ניווט"><a href="../index.html">🏠 דף הבית</a><a href="index.html">→ לשיעור</a></nav><div class="wrap"><div class="head"><h1>ויסות זרימת הדם לרקמות</h1><p>11 שאלות רב־ברירה. כתבו שם וכיתה, ענו על כל השאלות ולחצו על "הגשה". בסוף תקבלו ציון ובדיקה של כל תשובה, ותוכלו לשמור את הכול כקובץ PDF.</p>

<div class="res" id="res"></div></div><script>const Q=[{"q": "האם כמות הדם הזורמת לאיברים השונים בגוף משתנה במעבר ממנוחה לפעילות גופנית מאומצת?", "o": ["לא. כמות הדם המוזרמת לכל איבר נשארת תמיד קבועה", "לא, מכיוון שכמות הדם הכללית בגוף אינה משתנה", "כן. כמות הדם המוזרמת לשרירים עולה, ואילו כמות הדם המוזרמת למערכת העיכול יורדת", "כן. כמות הדם המוזרמת לשרירים עולה, וגם כמות הדם המוזרמת למערכת העיכול עולה"], "a": 2, "e": "כמות הדם הכללית קבועה, אבל החלוקה שלה בין האיברים משתנה."}, {"q": "בטבלה: קצב זרימת הדם לשרירי הרגליים במנוחה 1,200 מ\"ל לדקה וברכיבה על אופניים 12,500 מ\"ל לדקה. קצב הזרימה למעיים במנוחה 1,400 מ\"ל לדקה וברכיבה 600 מ\"ל לדקה. איזה תיאור מתאים לנתונים?", "o": ["ברכיבה הזרימה לשני האיברים עולה", "ברכיבה הזרימה לרגליים גדלה פי 10 בערך, והזרימה למעיים קטנה לפחות ממחצית", "ברכיבה הזרימה לשני האיברים קטנה", "ברכיבה הזרימה לרגליים קטנה, והזרימה למעיים גדלה"], "a": 1, "e": "12,500 ÷ 1,200 ≈ 10; 600 קטן ממחצית 1,400."}, {"q": "על פי אותה טבלה: מה היתרון בעלייה בזרימת הדם לשרירי הרגליים בזמן רכיבה?", "o": ["יותר חמצן וגלוקוז מגיעים לתאי השריר, והנשימה התאית בהם מתרחשת בקצב גבוה", "יותר דם מגיע לרגליים, ולכן כמות הדם בגוף גדלה", "פחות חום נוצר בשרירים", "תאי השריר מפסיקים לייצר פחמן דו־חמצני"], "a": 0, "e": "בשרירים פעילים קצב הנשימה התאית גבוה. זרימת דם מוגברת מספקת להם יותר חמצן וגלוקוז ומסלקת מהם יותר פחמן דו־חמצני."}, {"q": "ילדה קופצת בחבל, ולאחר מכן אוכלת גלידה. האם כמות הדם המוזרמת אל המוח שלה תהיה גדולה יותר בזמן הקפיצה בחבל?", "o": ["כן, כי במאמץ כל האיברים מקבלים יותר דם", "כן, כי המוח צורך יותר חמצן בזמן קפיצה", "לא, כמות הדם הזורמת למוח נשארת כמעט קבועה", "לא, בזמן מאמץ לא זורם דם למוח"], "a": 2, "e": "אספקת הדם למוח כמעט קבועה במנוחה, במאמץ ואחרי ארוחה."}, {"q": "אותה ילדה אוכלת גלידה אחרי הקפיצה. לאיזה איבר תגדל זרימת הדם בזמן העיכול?", "o": ["לשרירי הרגליים", "למערכת העיכול", "למוח", "לעור"], "a": 1, "e": "בזמן עיכול וספיגה כלי הדם המובילים לקיבה ולמעיים מתרחבים."}, {"q": "בזמן מאמץ גופני הפנים מאדימות. מה היתרון בהגברה של זרימת הדם לעור בזמן מאמץ?", "o": ["יותר חמצן מגיע לתאי העור", "יותר חום עובר מהגוף לסביבה, וטמפרטורת הגוף נשמרת", "העור מייצר יותר תאי דם אדומים", "פחות דם מגיע לשרירים"], "a": 1, "e": "במאמץ משתחרר חום רב בשרירים. זרימת דם מוגברת בכלי הדם ההיקפיים שבעור מגבירה את מעבר החום לסביבה."}, {"q": "המשתתפים בתחרות ריצה מזיעים, גם כאשר טמפרטורת הסביבה נמוכה. מה גורם לכך?", "o": ["נשימה תאית מוגברת בתאי שריר", "הגברה של זרימת הדם למוח", "ירידה בזרימת הדם לעור", "הפרשה מוגברת של אריתרופויטין"], "a": 0, "e": "בנשימה תאית מוגברת בשרירים משתחרר חום רב, וטמפרטורת הגוף עולה גם בסביבה קרה."}, {"q": "איזה מן השינויים יגדיל את תפוקת הלב?", "o": ["הגברה של קצב חילוף הגזים בנאדיות", "הגברת ההזעה", "האטת הדופק", "הגדלה של נפח הפעימה"], "a": 3, "e": "תפוקת לב = קצב לב × נפח פעימה."}, {"q": "בשתי הדקות הראשונות של פעילות גופנית עולים גם קצב הלב וגם נפח הפעימה. מה התוצאה של שני השינויים יחד?", "o": ["כמות הדם בגוף גדלה", "תפוקת הלב עולה, ויותר דם מגיע בכל דקה לשרירים הפעילים", "לחץ הדם בוורידים עולה על לחץ הדם בעורקים", "זרימת הדם למוח גדלה פי 10"], "a": 1, "e": "קצב לב גבוה ונפח פעימה גדול מגדילים את כמות הדם שהלב מזרים בכל דקה."}, {"q": "באיזו דרך משתנה כמות הדם שמגיעה לאיבר מסוים במצבי פעילות שונים?", "o": ["דרך שינוי בכמות הדם הכללית בגוף", "דרך התרחבות או הצטמצמות של כלי הדם המובילים אל האיבר", "דרך מעבר דם מהוורידים ישירות לעורקים", "דרך הוספה של נימים חדשים בכל מאמץ"], "a": 1, "e": "כשכלי הדם המובילים לאיבר מתרחבים, יותר דם זורם אליו; כשהם מצטמצמים, פחות דם זורם אליו."}, {"q": "מדוע לא כל האיברים יכולים לקבל זרימת דם מרבית באותו זמן?", "o": ["כי כמות הדם בגוף מוגבלת, ותפוקת הלב מוגבלת", "כי הדם זורם רק בכיוון אחד", "כי במוח אין נימים", "כי העורקים אינם גמישים"], "a": 0, "e": "הדם מתחלק בין האיברים לפי הפעילות שלהם, מתוך כמות מוגבלת."}];const L="אבגד";const f=document.getElementById('f');
f.innerHTML=Q.map((x,i)=>`<fieldset id="q${i}"><legend>${i+1}. ${x.q}</legend>${x.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}">${L[j]}. ${o}</label>`).join('')}<p class="ex">${x.e}</p></fieldset>`).join('');
document.getElementById('send').onclick=()=>{if(!document.getElementById('nm').value.trim()){document.getElementById('miss').textContent='כתבו את השם שלכם למעלה.';document.getElementById('nm').focus();return}const miss=Q.map((x,i)=>f.querySelector(`[name=q${i}]:checked`)?null:i+1).filter(Boolean);
 if(miss.length){document.getElementById('miss').textContent='לא עניתם על שאלות: '+miss.join(', ');return}
 document.getElementById('miss').textContent='';let s=0;
 Q.forEach((x,i)=>{const fs=document.getElementById('q'+i),v=+f.querySelector(`[name=q${i}]:checked`).value;fs.classList.add('done');
  fs.querySelectorAll('.opt').forEach((l,j)=>{if(j===x.a)l.classList.add('ok');else if(j===v)l.classList.add('no')});
  fs.querySelectorAll('input').forEach(n=>n.disabled=true);if(v===x.a)s++});
 const r=document.getElementById('res'),nm=document.getElementById('nm').value.trim(),cl=document.getElementById('cl').value.trim();
 r.innerHTML=`<div>${nm?nm.replace(/[<>&]/g,''):''} ${cl?'· '+cl.replace(/[<>&]/g,''):''}</div><div class="n">${Math.round(s/Q.length*100)}</div><div>${s} תשובות נכונות מתוך ${Q.length}</div>`;r.classList.add('on');r.insertAdjacentHTML('beforeend',`<button type="button" class="pdfbtn" onclick="window.print()">📄 שמירה כ־PDF</button><p class="pdfhint">בחלון שנפתח בחרו "שמירה כ־PDF" (Save as PDF), ושמרו או הגישו את הקובץ.</p>`);
 document.getElementById('send').disabled=true;r.scrollIntoView({behavior:'smooth'});
};</script><style id="atlas">:root{--bg:#F4F7FA;--ink:#13233A;--mut:#5E6E82;--acc:#D7263D;--card:#fff;--line:#DCE3EA;--ok:#1E7B4D;--no:#B3261E}
