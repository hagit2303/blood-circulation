<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>התזונאי של הרפת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700;800&display=swap">
<style>
/* Layout: a single reading column of "feed tags"; each station is a numbered ear tag, info sheet on top, field tasks below, a boarding-pass style gate card at the end. */
:root{
  --bg:#f3f6ef;          /* pale silage green */
  --paper:#ffffff;
  --ink:#1f2a1e;
  --muted:#5b6a57;
  --line:#d6dfcf;
  --accent:#2f6b3a;      /* pasture green */
  --accent-soft:#e3efe0;
  --tag:#f5c518;         /* yellow ear tag */
  --tag-ink:#3a2f00;
  --good:#1f7a43; --good-bg:#e2f4e8;
  --warn:#9a5b00; --warn-bg:#fff1d6;
  --bad:#b3261e;  --bad-bg:#fde6e3;
  --info-bg:#eef4fb; --info-ink:#1d4a78;
  --shadow:0 1px 2px rgba(31,42,30,.06),0 4px 14px rgba(31,42,30,.06);
  --f-display:"Secular One","Assistant",system-ui,sans-serif;
  --f-body:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a14;--paper:#1c241c;--ink:#e8efe4;--muted:#a6b5a0;--line:#2f3a2e;--accent:#7fc58c;--accent-soft:#223322;
  --tag:#f5c518;--tag-ink:#2a2200;--good:#7ad69a;--good-bg:#173323;--warn:#f2b45a;--warn-bg:#3a2a10;--bad:#ff8f86;--bad-bg:#3d1c19;
  --info-bg:#182636;--info-ink:#a9cdf2;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a14;--paper:#1c241c;--ink:#e8efe4;--muted:#a6b5a0;--line:#2f3a2e;--accent:#7fc58c;--accent-soft:#223322;
  --tag:#f5c518;--tag-ink:#2a2200;--good:#7ad69a;--good-bg:#173323;--warn:#f2b45a;--warn-bg:#3a2a10;--bad:#ff8f86;--bad-bg:#3d1c19;
  --info-bg:#182636;--info-ink:#a9cdf2;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{direction:rtl}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.65;margin:0;padding-inline:16px;padding-block:0 60px}
.wrap{max-width:820px;margin-inline:auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.25;text-wrap:balance;margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--tag);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar .brand{font-family:var(--f-display);font-size:1.1rem;color:var(--accent);margin-inline-end:auto}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.milk{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.linkbtn{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--ink);font-weight:600}
.linkbtn:hover{border-color:var(--accent)}

/* station map */
.map{display:flex;gap:8px;flex-wrap:wrap;padding-block:14px}
.stop{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:12px;background:var(--paper);border:1px solid var(--line);font-weight:600;font-size:.95rem;color:var(--ink)}
.stop[disabled]{opacity:.45;cursor:not-allowed}
.stop.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.stop.done .eartag{background:var(--accent);color:#fff}
.eartag{display:inline-grid;place-items:center;width:30px;height:34px;background:var(--tag);color:var(--tag-ink);font-family:var(--f-display);font-size:1rem;border-radius:9px 9px 14px 14px;position:relative;flex:none}
.eartag::before{content:"";position:absolute;top:4px;width:6px;height:6px;border-radius:50%;background:var(--bg)}
.eartag span{margin-top:8px}

/* hero */
.hero{padding-block:22px 8px;display:grid;gap:10px}
.hero h1{font-size:clamp(1.8rem,5vw,2.6rem);color:var(--accent)}
.hero p{margin:0;max-width:65ch}
.namebox{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.namebox label{font-weight:700}
.namebox input{flex:1 1 200px;min-width:0;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.routine{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.95rem}
.routine b{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-weight:600}
.routine i{font-style:normal;color:var(--muted)}

/* station */
.station{display:grid;gap:18px;padding-block:10px}
.st-head{display:flex;gap:14px;align-items:flex-start}
.st-head .eartag{width:54px;height:62px;font-size:1.6rem;border-radius:14px 14px 22px 22px}
.st-head .eartag::before{top:7px;width:9px;height:9px}
.st-head .eartag span{margin-top:14px}
.st-head h2{font-size:clamp(1.4rem,4vw,1.9rem)}
.st-head .meta{color:var(--muted);font-size:.95rem}
.goals{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.goals h3{font-size:1rem;color:var(--accent);margin-bottom:4px}
.goals ul{margin:0;padding-inline-start:20px}

.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card > h3{font-size:1.2rem;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.label{display:inline-block;font-size:.78rem;font-weight:800;letter-spacing:.04em;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-bottom:8px}
.info p{margin:.4em 0;max-width:68ch}
.info ul,.info ol{margin:.3em 0;padding-inline-start:22px}
.info li{margin:.15em 0}
.term{border-bottom:2px dotted var(--accent);cursor:help;font-weight:600}
.note{background:var(--info-bg);color:var(--info-ink);border-radius:12px;padding:10px 14px;margin-top:10px;font-size:.95rem}
.note b{color:inherit}
.kcal{display:flex;gap:10px;flex-wrap:wrap;margin:.6em 0}
.kcal div{flex:1 1 120px;background:var(--bg);border-radius:12px;padding:8px 12px;text-align:center}
.kcal strong{display:block;font-family:var(--f-display);font-size:1.6rem;color:var(--accent);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto;margin:.6em 0}
.tbl table{border-collapse:collapse;width:100%;min-width:420px;font-size:.95rem}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 10px;text-align:right;vertical-align:top}
.tbl th{background:var(--accent-soft);color:var(--ink)}
.tbl td.num{font-variant-numeric:tabular-nums;text-align:center}

/* digestive flow */
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;margin:.6em 0}
.flow .node{flex:1 1 110px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:.9rem;min-width:0}
.flow .node b{display:block;color:var(--accent)}
.flow .arr{align-self:center;color:var(--muted);font-weight:800}

/* tasks */
.task{border-top:1px dashed var(--line);padding-top:14px;margin-top:14px}
.task:first-of-type{border-top:0;margin-top:0;padding-top:0}
.q{font-weight:700;margin-bottom:8px}
.q small{font-weight:400;color:var(--muted)}
.opts{display:grid;gap:8px}
.opt{text-align:right;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--ink);line-height:1.45}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--ink)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--ink)}
.opt[disabled]{cursor:default}
.fb{margin-top:8px;border-radius:12px;padding:8px 12px;font-size:.95rem}
.fb.ok{background:var(--good-bg);color:var(--good)}
.fb.no{background:var(--warn-bg);color:var(--warn)}
.fb.ok b,.fb.no b{color:inherit}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}

.pool,.slots,.bucket-items{display:flex;flex-wrap:wrap;gap:8px}
.pool{min-height:44px;padding:8px;border-radius:12px;background:var(--bg)}
.item{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:6px 12px;color:var(--ink);line-height:1.35;text-align:right}
.item.sel{border-color:var(--tag);box-shadow:0 0 0 3px var(--tag)}
.item.ok{border-color:var(--good);background:var(--good-bg)}
.item.bad{border-color:var(--bad);background:var(--bad-bg)}
.slots{flex-direction:column;gap:6px;margin-top:8px}
.slot{display:flex;gap:8px;align-items:center;min-height:42px;border:1.5px dashed var(--line);border-radius:10px;padding:4px 8px}
.slot .n{font-family:var(--f-display);color:var(--muted);width:20px;flex:none;text-align:center}
.slot .item{flex:1;min-width:0}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:10px}
.bucket{border:1.5px dashed var(--accent);border-radius:12px;padding:8px;min-height:90px;background:var(--paper);text-align:right;color:var(--ink);display:flex;flex-direction:column;gap:6px;align-items:stretch}
.bucket > b{color:var(--accent)}
.hint-sel{font-size:.9rem;color:var(--muted);margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:9px 18px;font-weight:700}
:root[data-theme="dark"] .btn{color:#10200f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#10200f}}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.tagbtn{background:var(--tag);color:var(--tag-ink)}
textarea{width:100%;min-height:120px;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);resize:vertical}
.checks{display:grid;gap:4px;margin-top:8px;font-size:.95rem}
.checks label{display:flex;gap:8px;align-items:flex-start}
.checks input{margin-top:6px;width:18px;height:18px;flex:none;accent-color:var(--accent)}
.counter{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
details.mashma{margin-top:8px;font-size:.92rem;background:var(--bg);border-radius:10px;padding:6px 12px}
details.mashma summary{cursor:pointer;font-weight:700;color:var(--accent)}
.saved{color:var(--good);font-weight:700}
input.numin{font:inherit;width:140px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}

/* gate ticket */
.gate{background:var(--paper);border:2px solid var(--tag);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.gate .gh{background:var(--tag);color:var(--tag-ink);padding:10px 18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.gate .gh h3{font-size:1.2rem}
.gate .gb{padding:18px;display:grid;gap:16px}
.gate .locked{color:var(--muted);font-weight:600}
.gate.passed{border-color:var(--good)}
.gate.passed .gh{background:var(--good);color:#fff}

.reflect{display:flex;gap:8px;flex-wrap:wrap}
.reflect button{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:6px 12px;color:var(--ink)}
.reflect button.on{border-color:var(--accent);background:var(--accent-soft)}

/* simulator */
.sim{display:grid;gap:14px}
.sim-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.ing{background:var(--bg);border-radius:12px;padding:8px 12px;min-width:0}
.ing .top{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:.95rem}
.ing .top output{font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap}
.ing small{color:var(--muted);display:block;font-size:.8rem}
.ing input[type=range]{width:100%;accent-color:var(--accent)}
.toggles{display:flex;gap:14px;flex-wrap:wrap}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:600;background:var(--bg);padding:6px 12px;border-radius:10px}
.toggles input{width:18px;height:18px;accent-color:var(--accent)}
.gauges{display:grid;gap:10px}
.gauge .gl{display:flex;justify-content:space-between;font-size:.92rem;font-weight:700}
.gauge .gl span:last-child{font-variant-numeric:tabular-nums}
.track{position:relative;height:14px;border-radius:999px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.band{position:absolute;top:0;bottom:0;background:var(--good-bg);border-inline:2px solid var(--good)}
.pin{position:absolute;top:-2px;width:4px;height:16px;border-radius:2px;background:var(--ink)}
.alerts{display:grid;gap:6px}
.alert{border-radius:10px;padding:8px 12px;font-size:.95rem;font-weight:600}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.good{background:var(--good-bg);color:var(--good)}
.cowbox{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:14px;padding:10px 14px}
.cowbox .face{font-size:2.4rem;line-height:1}
.cowbox b{display:block}

/* glossary drawer */
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;justify-content:flex-start}
.drawer .panel{background:var(--paper);width:min(420px,100%);height:100%;overflow-y:auto;padding:18px;padding-top:calc(18px + env(safe-area-inset-top,0px));box-shadow:var(--shadow)}
.drawer dl{margin:0;display:grid;gap:8px}
.drawer dt{font-weight:800;color:var(--accent)}
.drawer dd{margin:0 0 6px;font-size:.95rem}
.drawer .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}

.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 18px;border-radius:999px;font-weight:700;z-index:60;box-shadow:var(--shadow)}

/* report */
.report pre{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:12px;font-family:var(--f-body);font-size:.95rem;max-height:420px;overflow:auto;margin:0}
.confirm{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-weight:600}
footer{color:var(--muted);font-size:.85rem;padding-block:24px;text-align:center}
</style>

<div class="wrap">
  <div class="bar">
    <span class="brand">🐄 התזונאי של הרפת</span>
    <span class="chip milk" id="milk" title="ליטרים שצברתם">🥛 <span id="milkN">0</span> ליטר</span>
    <button class="linkbtn" id="openGloss" type="button">📖 מילון רפתן</button>
  </div>
  <nav class="map" id="map" aria-label="מפת התחנות"></nav>
  <main id="main"></main>
  <footer>יחידת לימוד בחקלאות · תחום בעלי חיים · אבות המזון והזנת בקר · ערכי הסימולטור מקורבים לצורכי לימוד</footer>
</div>

<div class="drawer" id="gloss" hidden>
  <div class="panel" role="dialog" aria-label="מילון רפתן">
    <div class="ph"><h2>📖 מילון רפתן</h2><button class="linkbtn" id="closeGloss" type="button">סגירה ✕</button></div>
    <dl id="glossList"></dl>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===================== מילון ===================== */
const GLOSS = [
  ["אבות המזון","שש קבוצות של רכיבי מזון: פחמימות, חלבונים, שומנים, ויטמינים, מינרלים ומים."],
  ["חומר אורגני","חומר שבנוי על שלד של פחמן ומיוצר בידי יצורים חיים: פחמימות, חלבונים, שומנים, ויטמינים."],
  ["חומר אי-אורגני","חומר שאינו בנוי על שלד פחמן: מינרלים ומים."],
  ["פוטוסינתזה","תהליך שבו הצמח משתמש באנרגיית האור, בפחמן דו-חמצני ובמים ומייצר גלוקוז. מקור כל הפחמימות במזון."],
  ["גליקוגן","רב-סוכר שהוא חומר התשמורת של בעלי חיים. נאגר בכבד ובשרירים."],
  ["עמילן","רב-סוכר שהוא חומר התשמורת של הצמח. נמצא בגרעינים ובפקעות."],
  ["תאית","רב-סוכר שבונה את דופן התא של הצמח. עיקר הסיבים במזון הגס."],
  ["לקטוז","דו-סוכר שנמצא בחלב (סוכר החלב)."],
  ["חומצת אמינו חיונית","חומצת אמינו שהגוף אינו מייצר ולכן חייב לקבל מהמזון."],
  ["חלבון מלא","חלבון שמכיל את כל חומצות האמינו החיוניות. נמצא במזון מן החי."],
  ["שומן רווי","שומן שמקורו בעיקר בבעלי חיים. מוצק בטמפרטורת החדר."],
  ["שומן בלתי רווי","שומן שמקורו בעיקר בצמחים (שמן זית, סויה, פשתן). נוזלי בטמפרטורת החדר."],
  ["אומגה 3","חומצת שומן בלתי רוויה חיונית: הגוף אינו מייצר אותה. מקורות לבקר: זרעי פשתן ושמן דגים. מעשירה את החלב ואת הבשר באומגה 3."],
  ["הידרופובי","״שונא מים״: חומר שאינו מתערבב ואינו מתמוסס במים, כמו שומן."],
  ["מזון גס","מזון צמחי עשיר בסיבים (תאית): תחמיץ, שחת, קש, ירק ומרעה."],
  ["מזון מרוכז","מזון עשיר באנרגיה או בחלבון ודל בסיבים: גרעינים (תירס, שעורה), כוספות (סויה) ותערובות."],
  ["תחמיץ","מזון גס שנשמר בתסיסה ללא אוויר (למשל תחמיץ חיטה), נפוץ מאוד ברפתות בישראל."],
  ["שחת","צמחים (למשל חיטה) שנקצרו לפני הבשלת הגרעינים ויובשו."],
  ["קש","גבעולים יבשים שנשארו אחרי קציר הגרעינים. עשיר מאוד בתאית ודל בחלבון."],
  ["כוספת סויה","מה שנשאר מפולי סויה אחרי הפקת השמן. עשירה מאוד בחלבון."],
  ["חומר יבש","מה שנשאר מהמזון אחרי שמוציאים ממנו את כל המים. מנות לבקר מחושבות לפי חומר יבש."],
  ["TMR (בליל)","Total Mixed Ration: כל רכיבי המנה מעורבבים יחד, כך שבכל ביס הפרה מקבלת מנה מאוזנת."],

const $=(s,el=document)=>el.querySelector(s);
const h=(tag,attrs={},html="")=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v);}if(html!==undefined&&html!==null)e.innerHTML=html;return e;};

function addLiters(n,msg){ S.liters=Math.max(0,S.liters+n); save(); $("#milkN").textContent=S.liters; if(n>0) toast(`🥛 +${n} ליטר${msg?" · "+msg:""}`); }
let tT; function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,2200);}
function shuffle(a,seed){const r=a.slice();let s=seed||7;for(let i=r.length-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function seedOf(str){let x=0;for(const c of str)x=(x*31+c.charCodeAt(0))%100000;return x+3;}

function taskDone(t){
 if(t.type==="table") return true;
 if(t.type==="sim") return S.simOk && S.simSummerOk;
 return !!(S.ans[t.id] && S.ans[t.id].done);
}

function renderTask(t){
 const box=h("div",{class:"task"});
 if(t.type==="table"){ box.innerHTML=t.html; return box; }
 if(t.type==="mcq") return mcq(t,box,false);
 if(t.type==="order") return orderTask(t,box);
 if(t.type==="sort") return sortTask(t,box);
 if(t.type==="open") return openTask(t,box);
 if(t.type==="num") return numTask(t,box);
 if(t.type==="sim") return simTask(t,box);
 return box;
}

function mcq(t,box,isGate,onDone){
 box.appendChild(h("div",{class:"q"},t.q));
 const opts=h("div",{class:"opts"}); box.appendChild(opts);
 const fb=h("div",{class:"fb",hidden:""});
 const st=S.ans[t.id]||{};
 t.opts.forEach((o,i)=>{
  const b=h("button",{class:"opt",type:"button"},o);
  if(st.done){ b.disabled=true; if(i===t.a) b.classList.add("right"); }
  b.onclick=()=>{
   S.tries[t.id]=(S.tries[t.id]||0)+1;
   if(i===t.a){
    const first=S.tries[t.id]===1; S.first[t.id]=first;
    S.ans[t.id]={done:true,choice:o};
    opts.querySelectorAll(".opt").forEach(x=>x.disabled=true);
    b.classList.add("right");
    fb.className="fb ok"; fb.hidden=false; fb.innerHTML="✅ "+(t.ok||"נכון!");
    addLiters(isGate?(first?30:10):(first?20:5), first?"במכה ראשונה":"");
    save(); if(onDone) onDone();
    refreshGate();
   }else{
    b.classList.add("wrong","shake"); b.disabled=true;
    fb.className="fb no"; fb.hidden=false; fb.innerHTML="🔍 <b>עוד לא.</b> רמז: "+t.hint;
    save();
   }
  };
  opts.appendChild(b);
 });
 if(st.done){ fb.className="fb ok"; fb.hidden=false; fb.innerHTML="✅ "+(t.ok||"נכון!"); }
 box.appendChild(fb);
 return box;
}

function orderTask(t,box){
 box.appendChild(h("div",{class:"q"},t.q));
 const st=S.ans[t.id]; const isDone=()=>!!(S.ans[t.id]&&S.ans[t.id].done);

}

 if(r.cp<TARGET.cp[0]) B("🧬 חסר חלבון: אין מספיק חומצות אמינו לבניית חלבוני החלב, השרירים, האנזימים והנוגדנים.");

 if((+S.sim.pf||0)>2) W("🐟 יותר מדי זרעי פשתן: גם שומן ״בריא״ כמו אומגה 3 פוגע בעיכול בכמות גדולה. הגבילו לכמות קטנה.");

  const row=h("div",{class:"row"});
  const go=h("button",{class:"btn tagbtn",type:"button"}, nx?`לתחנה ${nx.num}: ${nx.title.split(":")[0]} ←`:"לדו״ח הסיום 📋 ←");
  go.onclick=()=>{S.cur=nx?nx.id:"report";save();render();window.scrollTo({top:0,behavior:"smooth"});};
  row.appendChild(go); body.appendChild(row);
 }
}
function refreshGate(){ fillGate(); }

/* ---------- report ---------- */
function renderReport(){
 const sec=h("section",{class:"station report"});
 sec.appendChild(h("div",{class:"st-head"},`<span class="eartag" aria-hidden="true"><span>✓</span></span><div><h2>📋 דו״ח התזונאי</h2><div class="meta">העתיקו את הדו״ח והגישו לפי הנחיית המורה (Google Classroom או טופס)</div></div>`));
 const ids=Object.keys(S.first); const firstOk=ids.filter(k=>S.first[k]).length;
 const pct=ids.length?Math.round(firstOk/ids.length*100):0;
 const lines=[];
 lines.push(`דו״ח יחידה: התזונאי/ת הראשי/ת של הרפת`);
 lines.push(`שם: ${S.name||"(לא הוזן שם)"}`);
 lines.push(`תאריך: ${new Date().toLocaleDateString("he-IL")}`);
 lines.push(`ליטרים שנצברו: ${S.liters}`);
 lines.push(`הצלחה בניסיון הראשון: ${pct}%`);
 lines.push("");
 STATIONS.forEach(st=>{
  lines.push(`■ תחנה ${st.num}: ${st.title}`);
  lines.push(`  הרגשה: ${S.reflect[st.id]||"לא סומן"}`);
  st.tasks.filter(t=>t.type==="open").forEach(t=>{
   const tmp=document.createElement("div"); tmp.innerHTML=t.q;
   lines.push(`  שאלה: ${tmp.textContent}`);
   lines.push(`  תשובה: ${(S.ans[t.id]&&S.ans[t.id].text||"").trim()}`);
  });
  if(st.id==="s6"){
   const fmt=o=>o?ING.map(i=>`${i.n} ${(+o[i.k]).toFixed(1)}`).join(", "):"לא הושלם";
   lines.push(`  מנה מאוזנת (ק״ג חומר יבש): ${fmt(S.simRation)}`);
   lines.push(`  מנת קיץ (ק״ג חומר יבש): ${fmt(S.simRationSummer)}`);
  }
  lines.push("");
 });
 const text=lines.join("\n");
 const card=h("div",{class:"card"});
 card.appendChild(h("div",{class:"kcal"},`<div><strong>${S.liters}</strong>🥛 ליטרים שנצברו</div><div><strong>${pct}%</strong>הצלחה בניסיון ראשון</div><div><strong>${Object.keys(S.passed).length}/7</strong>כרטיסי מעבר</div>`));
 const pre=h("pre",{id:"reportText",tabindex:"0"}); pre.textContent=text; card.appendChild(pre);
 const row=h("div",{class:"row"});
 const cp=h("button",{class:"btn",type:"button"},"📋 העתקת הדו״ח");
 cp.onclick=()=>{
  const sel=()=>{const r=document.createRange();r.selectNodeContents(pre);const s=window.getSelection();s.removeAllRanges();s.addRange(r);toast("הטקסט מסומן. העתיקו אותו ידנית.");};
  try{ navigator.clipboard.writeText(text).then(()=>toast("✔ הדו״ח הועתק"),sel); }catch(e){ sel(); }
 };
 row.appendChild(cp);
 card.appendChild(row);
 sec.appendChild(card);
 const last=h("div",{class:"card"},`<h3>🌱 שאלת סיכום אישית</h3><p>מה למדתי על עצמי כלומד/ת עצמאי/ת ביחידה הזו? מה עזר לי (המילון, הרמזים, הבדיקה העצמית)? כתבו גם בתחתית הדו״ח שהגשתם.</p>`);
 sec.appendChild(last);
 const rs=h("div",{class:"card"});
 const rb=h("button",{class:"btn ghost",type:"button"},"↺ התחלת היחידה מחדש");
 rb.onclick=()=>{ rs.innerHTML=""; const c=h("div",{class:"confirm"},"כל התשובות והליטרים יימחקו מהמכשיר הזה. להמשיך?"); const y=h("button",{class:"btn",type:"button"},"כן, למחוק"); const n=h("button",{class:"btn ghost",type:"button"},"ביטול"); y.onclick=()=>{try{localStorage.removeItem(KEY);}catch(e){} location.reload();}; n.onclick=()=>render(); c.appendChild(y); c.appendChild(n); rs.appendChild(c); };
 rs.appendChild(rb); sec.appendChild(rs);
 return sec;
}

/* ---------- glossary ---------- */
function openGloss(focus){
 const dl=$("#glossList"); dl.innerHTML="";
 GLOSS.forEach(([t,d])=>{const dt=h("dt",{},t); const dd=h("dd",{},d); if(focus&&t.startsWith(focus.split(" ")[0])){dt.style.background="var(--tag)";dt.style.color="var(--tag-ink)";dt.style.borderRadius="6px";dt.style.padding="0 6px";} dl.appendChild(dt); dl.appendChild(dd);});
 $("#gloss").hidden=false;
 if(focus){const hit=[...dl.querySelectorAll("dt")].find(x=>x.textContent.startsWith(focus.split(" ")[0])); if(hit) hit.scrollIntoView({block:"center"});}
}
$("#openGloss").onclick=()=>openGloss();
$("#closeGloss").onclick=()=>$("#gloss").hidden=true;
$("#gloss").addEventListener("click",e=>{if(e.target.id==="gloss")$("#gloss").hidden=true;});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#gloss").hidden=true;});

render();
</script>
